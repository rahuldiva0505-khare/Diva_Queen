<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#65184b"><title>Diva Queen</title>
<style>
:root{--p:#65184b;--p2:#8e326b;--gold:#d5a54a;--bg:#f5f5f7;--dark:#222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--dark)}
header{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 12px #0001}.top{display:flex;align-items:center;gap:8px;padding:11px 12px}.brand{display:flex;align-items:center;gap:5px;color:var(--p);font-weight:850;font-size:20px;white-space:nowrap}.brand b{color:var(--gold)}.search{flex:1;min-width:80px;padding:11px 12px;border:1px solid #ddd;border-radius:12px;font-size:14px}.top button,.nav button{border:0;border-radius:10px;padding:9px 11px;background:#f4eaf0}.nav{display:flex;gap:7px;overflow:auto;padding:8px 11px;border-top:1px solid #eee}.nav button{white-space:nowrap;color:var(--p)}
main{max-width:1100px;margin:auto;padding:12px}.hero{border-radius:20px;padding:25px 20px;min-height:205px;color:white;background:linear-gradient(135deg,#48102f,#a94476);display:flex;justify-content:space-between;align-items:center;overflow:hidden}.hero small{letter-spacing:1px}.hero h1{font-size:31px;margin:6px 0}.hero p{opacity:.9}.hero button{background:white;color:var(--p);border:0;padding:12px 18px;border-radius:12px;font-weight:800}.crown{font-size:100px;opacity:.85}.rowhead{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.rowhead h2{margin:0;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 10px #0000000b}.pic{height:165px;background:linear-gradient(135deg,#eee,#fafafa);display:grid;place-items:center;font-size:58px}.info{padding:11px}.title{font-weight:700;min-height:40px}.price{font-weight:850;font-size:18px;margin-top:4px}.old{text-decoration:line-through;color:#888;font-size:12px;margin-left:5px}.stock{font-size:12px;color:#666;margin-top:4px}.add{width:100%;background:#ffd814;border:0;padding:10px;border-radius:10px;font-weight:800;margin-top:8px}.secondary{width:100%;background:#f3edf1;border:0;padding:9px;border-radius:10px;margin-top:6px}
.cartbar{position:fixed;left:12px;right:12px;bottom:12px;background:#222;color:#fff;border-radius:16px;padding:12px 14px;z-index:19;display:none;justify-content:space-between;align-items:center;box-shadow:0 5px 20px #0004}.cartbar button{background:#ffd814;border:0;padding:9px 14px;border-radius:10px;font-weight:800}
.panel{position:fixed;inset:0;background:#fff;z-index:30;display:none;overflow:auto}.panel.show{display:block}.panelhead{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;padding:13px;display:flex;align-items:center;gap:10px;z-index:2}.back{border:0;background:#f1f1f1;padding:9px;border-radius:9px}.content{max-width:760px;margin:auto;padding:16px}.field{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font:inherit}.primary{width:100%;padding:12px;background:var(--p);color:#fff;border:0;border-radius:10px;font-weight:800}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{border:0;background:#f1e8ed;padding:9px 12px;border-radius:9px;color:var(--p);white-space:nowrap}.admin-card{background:#fafafa;border:1px solid #eee;border-radius:12px;padding:12px;margin:8px 0}.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.danger{background:#fee;color:#a00;border:0;border-radius:8px;padding:8px}.muted{color:#777;font-size:13px}.empty{text-align:center;padding:35px;color:#777}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.pic{height:205px}}
</style></head>
<body>
<header><div class="top"><div class="brand">♕ <span>Diva <b>Queen</b></span></div><input id="search" class="search" placeholder="Search products..."><button onclick="openPanel('cart')">🛒</button><button onclick="openPanel('admin')">⚙️</button></div>
<div class="nav"><button onclick="setCat('All')">All</button><button onclick="setCat('Fashion')">Fashion</button><button onclick="setCat('Beauty')">Beauty</button><button onclick="setCat('Jewellery')">Jewellery</button><button onclick="setCat('Home')">Home</button><button onclick="setCat('Electronics')">Electronics</button></div></header>

<main><section class="hero"><div><small>DIVA QUEEN</small><h1>Shop like a Queen 👑</h1><p>Fashion • Beauty • Jewellery • Home • More</p><button onclick="document.getElementById('products').scrollIntoView()">Shop Now</button></div><div class="crown">♕</div></section>
<div class="rowhead"><h2 id="heading">Featured Products</h2><span id="resultCount"></span></div><div id="products" class="grid"></div></main>
<div id="cartbar" class="cartbar"><span><b id="cartN">0</b> items · ₹<b id="cartT">0</b></span><button onclick="openPanel('cart')">View Cart</button></div>

<div id="productPanel" class="panel"><div class="panelhead"><button class="back" onclick="closePanels()">←</button><b>Product Details</b></div><div id="productDetail" class="content"></div></div>
<div id="cartPanel" class="panel"><div class="panelhead"><button class="back" onclick="closePanels()">←</button><b>Shopping Cart</b></div><div id="cartContent" class="content"></div></div>
<div id="accountPanel" class="panel"><div class="panelhead"><button class="back" onclick="closePanels()">←</button><b>My Account</b></div><div class="content"><h2>Welcome to Diva Queen</h2><input class="field" placeholder="Mobile number / Email"><input class="field" placeholder="Password" type="password"><button class="primary">Login</button><p class="muted">Account system is ready for backend connection in the production build.</p></div></div>

<div id="adminPanel" class="panel"><div class="panelhead"><button class="back" onclick="closePanels()">←</button><b>👑 Diva Queen Admin</b></div><div class="content">
<div class="tabs"><button onclick="adminTab('products')">Products</button><button onclick="adminTab('orders')">Orders</button><button onclick="adminTab('home')">Home Banner</button></div>
<div id="adminArea"></div></div></div>

<script>
const demo=[
{id:1,n:'Elegant Party Dress',p:1499,old:1999,c:'Fashion',e:'👗',s:20,d:'Elegant party wear dress for your special occasions.'},
{id:2,n:'Luxury Face Serum',p:699,old:899,c:'Beauty',e:'🧴',s:35,d:'Premium skincare serum.'},
{id:3,n:'Royal Pearl Necklace',p:1199,old:1599,c:'Jewellery',e:'📿',s:15,d:'Elegant pearl jewellery for a royal look.'},
{id:4,n:'Designer Handbag',p:999,old:1299,c:'Fashion',e:'👜',s:12,d:'Stylish everyday designer handbag.'},
{id:5,n:'Queen Lipstick Set',p:499,old:699,c:'Beauty',e:'💄',s:40,d:'Beautiful lipstick collection.'},
{id:6,n:'Home Decor Vase',p:799,old:999,c:'Home',e:'🏺',s:18,d:'Premium decorative vase.'},
{id:7,n:'Crystal Earrings',p:599,old:799,c:'Jewellery',e:'💎',s:25,d:'Sparkling crystal earrings.'},
{id:8,n:'Classic Heels',p:1299,old:1699,c:'Fashion',e:'👠',s:10,d:'Classic heels for parties and events.'},
{id:9,n:'Wireless Earbuds',p:1499,old:1999,c:'Electronics',e:'🎧',s:22,d:'Wireless earbuds for everyday use.'}
];
let products=JSON.parse(localStorage.getItem('dq_products')||'null')||demo;
let cart=JSON.parse(localStorage.getItem('dq_cart')||'[]');
let orders=JSON.parse(localStorage.getItem('dq_orders')||'[]');
let cat='All';

const money=n=>Number(n).toLocaleString('en-IN');
function save(){localStorage.setItem('dq_products',JSON.stringify(products));localStorage.setItem('dq_cart',JSON.stringify(cart));localStorage.setItem('dq_orders',JSON.stringify(orders))}
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let arr=products.filter(x=>(cat==='All'||x.c===cat)&&(!q||x.n.toLowerCase().includes(q)||x.c.toLowerCase().includes(q)));
 document.getElementById('resultCount').textContent=arr.length+' items';
 document.getElementById('products').innerHTML=arr.map(x=>`<div class="card"><div class="pic">${x.e||'🛍️'}</div><div class="info"><div class="title">${x.n}</div><div class="price">₹${money(x.p)} <span class="old">₹${money(x.old||x.p)}</span></div><div class="stock">${x.s>0?x.s+' in stock':'Out of stock'}</div><button class="add" ${x.s<=0?'disabled':''} onclick="addToCart(${x.id})">Add to Cart</button><button class="secondary" onclick="showProduct(${x.id})">View Details</button></div></div>`).join('')||'<div class="empty">No products found.</div>';
 updateCart();
}
function setCat(c){cat=c;document.getElementById('heading').textContent=c==='All'?'Featured Products':c;render()}
function addToCart(id){let p=products.find(x=>x.id===id);if(!p||p.s<1)return;let i=cart.find(x=>x.id===id);if(i)i.q++;else cart.push({id,q:1});save();updateCart()}
function updateCart(){let n=cart.reduce((a,x)=>a+x.q,0),t=cart.reduce((a,x)=>{let p=products.find(y=>y.id===x.id);return a+(p?p.p*x.q:0)},0);document.getElementById('cartN').textContent=n;document.getElementById('cartT').textContent=money(t);document.getElementById('cartbar').style.display=n?'flex':'none'}
function openPanel(name){closePanels();document.getElementById(name+'Panel').classList.add('show');if(name==='cart')renderCart();if(name==='admin')adminTab('products')}
function closePanels(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'))}
function showProduct(id){let p=products.find(x=>x.id===id);document.getElementById('productDetail').innerHTML=`<div class="pic" style="height:280px;border-radius:16px">${p.e}</div><h1>${p.n}</h1><p>${p.d}</p><p><b>${p.c}</b> · ${p.s} in stock</p><h2>₹${money(p.p)} <span class="old">₹${money(p.old||p.p)}</span></h2><button class="add" onclick="addToCart(${p.id});closePanels()">Add to Cart</button>`;openPanel('product')}
function renderCart(){let box=document.getElementById('cartContent');if(!cart.length){box.innerHTML='<div class="empty"><h2>Your cart is empty</h2><button class="primary" onclick="closePanels()">Continue Shopping</button></div>';return}let total=0;box.innerHTML=cart.map(i=>{let p=products.find(x=>x.id===i.id);if(!p)return '';total+=p.p*i.q;return `<div class="item"><span>${p.e} <b>${p.n}</b><br>₹${money(p.p)} × ${i.q}</span><span><button onclick="changeQty(${p.id},-1)">−</button> <button onclick="changeQty(${p.id},1)">+</button></span></div>`}).join('')+`<h2>Total: ₹${money(total)}</h2><input id="address" class="field" placeholder="Delivery address"><input id="phone" class="field" placeholder="Mobile number"><select id="pay" class="field"><option>Cash on Delivery</option><option>UPI / Online Payment (connect later)</option></select><button class="primary" onclick="placeOrder()">Place Order</button>`}
function changeQty(id,d){let i=cart.find(x=>x.id===id);if(!i)return;i.q+=d;if(i.q<=0)cart=cart.filter(x=>x.id!==id);save();renderCart();updateCart()}
function placeOrder(){if(!document.getElementById('address').value||!document.getElementById('phone').value)return alert('Please enter delivery address and mobile number.');let items=cart.map(i=>{let p=products.find(x=>x.id===i.id);return {id:p.id,name:p.n,qty:i.q,price:p.p}});let total=items.reduce((a,x)=>a+x.qty*x.price,0);orders.unshift({id:'DQ'+Date.now(),date:new Date().toLocaleString('en-IN'),items,total,address:document.getElementById('address').value,phone:document.getElementById('phone').value,payment:document.getElementById('pay').value,status:'New'});items.forEach(i=>{let p=products.find(x=>x.id===i.id);p.s=Math.max(0,p.s-i.qty)});cart=[];save();closePanels();render();alert('Order placed successfully! Order ID: '+orders[0].id)}
function adminTab(tab){let a=document.getElementById('adminArea');if(tab==='products')a.innerHTML=`<h2>Manage Products</h2><div class="admin-card"><input id="an" class="field" placeholder="Product name"><input id="ap" class="field" type="number" placeholder="Price ₹"><input id="ao" class="field" type="number" placeholder="Old price ₹"><input id="ac" class="field" placeholder="Category (Fashion/Beauty/etc.)"><input id="ae" class="field" placeholder="Emoji / image placeholder"><input id="as" class="field" type="number" placeholder="Stock quantity"><input id="ad" class="field" placeholder="Description"><button class="primary" onclick="addProduct()">Add Product</button></div>`+products.map(x=>`<div class="item"><span>${x.e} <b>${x.n}</b><br>₹${money(x.p)} · ${x.c} · Stock ${x.s}</span><button class="danger" onclick="deleteProduct(${x.id})">Delete</button></div>`).join('');
if(tab==='orders')a.innerHTML='<h2>Orders</h2>'+ (orders.length?orders.map((o,i)=>`<div class="admin-card"><b>${o.id}</b> · ${o.status}<br>₹${money(o.total)} · ${o.payment}<br>${o.address}<br><small>${o.date}</small><br><button onclick="updateOrder(${i})">Update Status</button></div>`).join(''):'<div class="empty">No orders yet.</div>');
if(tab==='home')a.innerHTML=`<h2>Home Banner</h2><p class="muted">Your current banner is “Shop like a Queen”. You can later connect cloud content here.</p><input class="field" value="Shop like a Queen 👑"><button class="primary" onclick="alert('Banner settings saved in this demo.')">Save Banner</button>`}
function addProduct(){let n=an.value,p=+ap.value,o=+ao.value||p,c=ac.value||'Other',e=ae.value||'🛍️',s=+as.value||0,d=ad.value||'';if(!n||!p)return alert('Enter product name and price');products.unshift({id:Date.now(),n,p,old:o,c,e,s,d});save();render();adminTab('products');alert('Product added')}
function deleteProduct(id){products=products.filter(x=>x.id!==id);save();render();adminTab('products')}
function updateOrder(i){let next=['New','Confirmed','Packed','Shipped','Delivered','Cancelled'];let o=orders[i],k=next.indexOf(o.status);o.status=next[(k+1)%next.length];save();adminTab('orders')}
document.getElementById('search').addEventListener('input',render);render();
</script></body></html>
